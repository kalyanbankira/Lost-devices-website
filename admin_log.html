<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login</title>
<link rel="stylesheet" href="admin_log.css">
</head>
<body>

<form class="login-form" id="loginForm" novalidate>
  <h2>Office Login</h2>
  <p class="sub">Fill in all fields, then verify with the OTP.</p>

  <label for="aadhaar">Aadhaar number</label>
  <input type="text" id="aadhaar" inputmode="numeric" maxlength="14" placeholder="XXXX XXXX XXXX" autocomplete="off" required />
  <p class="msg" id="aadhaarMsg"></p>

  <label for="email">Email</label>
  <input type="email" id="email" placeholder="name@example.com" autocomplete="email" required />
  <p class="msg" id="emailMsg"></p>

  <label for="mobile">Mobile number</label>
  <div class="mobile-row">
    <span class="prefix">+91</span>
    <input type="tel" id="mobile" inputmode="numeric" maxlength="10" placeholder="XXXXXXXXXX" autocomplete="tel-national" required />
  </div>
  <p class="msg" id="mobileMsg"></p>

  <label for="password">Password</label>
  <input type="password" id="password" autocomplete="current-password" required />
  <p class="msg" id="passMsg"></p>
  <label class="show-password">
    <input type="checkbox" onclick="togglePassword()" /> Show Password
  </label>

  <label for="captchaInput">Captcha</label>
  <div class="captcha-row">
    <div class="captcha-box" id="captchaText" aria-label="Captcha code"></div>
    <button type="button" class="icon-btn" id="refreshCaptcha" aria-label="Get a new captcha">&#8635;</button>
  </div>
  <input id="captchaInput" class="captcha-input" type="text" autocomplete="off" placeholder="Type the code above" required />
  <p class="msg" id="captchaMsg"></p>

  <label for="otp">OTP</label>
  <div class="otp-row">
    <input id="otp" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="------" required />
    <button type="button" class="otp-btn" id="sendOtp">Send OTP</button>
  </div>
  <p class="msg" id="otpMsg"></p>

  <div class="forget-sign">
    <a href="#" class="forget">Forgot Password?</a>
    <a href="admin_reg.html" class="sign-in">Sign Up</a>
  </div>

  <button type="submit" class="login-button">Log In</button>
</form>

<script src="admin_log.js"></script>
</body>
</html>
