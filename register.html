<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - BANKIRA's</title>
  <link rel="stylesheet" href="register.css" />
</head>

<body>
  <header class="header1">
    <h1>Welcome ! Create Your Account</h1>
  </header>

  <div class="div_main">
    <main>
      <section class="form-section">
        <h2 class="user-reg">User Registration</h2>

        <form action="/register" method="post">
          <div class="name">
            <label for="fullname">Full name</label>
            <input id="fullname" type="text" name="fullname" autocomplete="name" required />
          </div>

          <div class="email">
            <label for="email">Email</label>
            <input id="email" type="email" name="email" autocomplete="email" required />
          </div>

          <div class="pass">
            <label for="password">Password</label>
            <input id="password" type="password" name="password" minlength="8" autocomplete="new-password" required />
            <small class="hint">Use at least 8 characters.</small>
          </div>

          <div class="pass">
            <label for="confirm">Confirm password</label>
            <input id="confirm" type="password" name="confirm" minlength="8" autocomplete="new-password" required />
          </div>

          <button type="submit" class="btn">Register</button>
        </form>

        <p class="login-link"> Already have an account ? <a href="login.html"> Login here </a></p>
      </section>
    </main>
  </div>

  <footer>
    <section class="social-links">
      <h3>Follow us</h3>
      <a href="https://facebook.com/" target="_blank" rel="noopener noreferrer" class="facebook">
        <img src="https://cdn.jsdelivr.net/npm/simple-icons@v9/icons/facebook.svg" alt="" />
        Facebook
      </a>
      <a href="https://instagram.com/" target="_blank" rel="noopener noreferrer" class="instagram">
        <img src="https://cdn.jsdelivr.net/npm/simple-icons@v9/icons/instagram.svg" alt="" />
        Instagram
      </a>
      <a href="https://twitter.com/" target="_blank" rel="noopener noreferrer" class="twitter">
        <img src="https://cdn.jsdelivr.net/npm/simple-icons@v9/icons/twitter.svg" alt="" />
        Twitter
      </a>
      <a href="https://linkedin.com/" target="_blank" rel="noopener noreferrer" class="linkedin">
        <img src="https://cdn.jsdelivr.net/npm/simple-icons@v9/icons/linkedin.svg" alt="" />
        LinkedIn
      </a>
      <a href="https://youtube.com/" target="_blank" rel="noopener noreferrer" class="youtube">
        <img src="https://cdn.jsdelivr.net/npm/simple-icons@v9/icons/youtube.svg" alt="" />
        YouTube
      </a>
    </section>
    <p>&copy; 2026 BANKIRA's. All rights reserved.</p>
  </footer>

  <script>
    // Make sure both passwords match before submitting
    const form = document.querySelector("form");
    const pw = document.getElementById("password");
    const confirmPw = document.getElementById("confirm");

    function checkMatch() {
      confirmPw.setCustomValidity(
        pw.value === confirmPw.value ? "" : "Passwords do not match."
      );
    }
    pw.addEventListener("input", checkMatch);
    confirmPw.addEventListener("input", checkMatch);
  </script>
</body>

</html>
